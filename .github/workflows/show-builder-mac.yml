# Builds the KobiKraken Show Builder Mac app on a Mac: .dmg installers and zips for Apple Silicon and Intel,
# ad-hoc signed. Each build is published as a GitHub Release (Releases on the repo's front page) with one
# download per Mac, and also kept in the run's Artifacts.
name: Show Builder Mac app

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/yamaha-show-builder/**'
      - '.github/workflows/show-builder-mac.yml'

permissions:
  contents: write # to publish the release

jobs:
  mac:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: tools/yamaha-show-builder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: npm test
      - name: Install Electron
        working-directory: tools/yamaha-show-builder/mac
        run: npm ci
      - name: Build the app
        working-directory: tools/yamaha-show-builder/mac
        run: node prepare.mjs && npx electron-builder --mac dir --arm64 --x64 --publish never
      - name: Sign (ad-hoc) and zip
        working-directory: tools/yamaha-show-builder/mac
        run: node sign.mjs
      - name: Make the .dmg installers from the signed apps
        working-directory: tools/yamaha-show-builder/mac
        run: |
          npx electron-builder --mac dmg --arm64 --publish never --prepackaged "dist/mac-arm64/KobiKraken Show Builder.app"
          npx electron-builder --mac dmg --x64 --publish never --prepackaged "dist/mac/KobiKraken Show Builder.app"
          codesign --verify --deep --strict "dist/mac-arm64/KobiKraken Show Builder.app"
      - uses: actions/upload-artifact@v4
        with:
          name: KobiKraken-Show-Builder-mac
          path: |
            tools/yamaha-show-builder/mac/dist/*.dmg
            tools/yamaha-show-builder/mac/dist/*.zip
          retention-days: 30
      - name: Publish as a release (one download per Mac)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="show-builder-v$VERSION"
          cd mac/dist
          ls -la *.dmg *.zip
          NOTES="KobiKraken Show Builder $VERSION, built from ${GITHUB_SHA::7}.

          **Apple Silicon (M1–M4):** the arm64 .dmg. **Intel:** the x64 .dmg. Open it and drag the app into Applications.
          First open: macOS 15+, open once, then System Settings → Privacy & Security → Open Anyway. macOS 14 and earlier, right-click → Open.
          When it asks to find devices on your local network, press Allow."
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" *.dmg *.zip --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" *.dmg *.zip --target "$GITHUB_SHA" --title "Show Builder $VERSION" --notes "$NOTES" --prerelease
          fi
