name: RingOut plug-in

on:
  push:
    paths: [ "ringout-vst/**", ".github/workflows/ringout-vst.yml" ]
  pull_request:
    paths: [ "ringout-vst/**", ".github/workflows/ringout-vst.yml" ]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest, extra: "" }
          - { name: macOS,   os: macos-latest,   extra: "'-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64'" }
          - { name: Linux,   os: ubuntu-latest,  extra: "" }

    defaults:
      run:
        working-directory: ringout-vst

    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxcomposite-dev libfontconfig1-dev libfreetype-dev libgl1-mesa-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.extra }}
        shell: bash

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: DSP tests
        shell: bash
        run: |
          exe=$(find build -type f \( -name RingOutTests -o -name RingOutTests.exe \) | head -1)
          "$exe"

      - name: Collect plug-ins
        shell: bash
        run: |
          mkdir -p dist
          cp -R build/RingOut_artefacts/Release/VST3/RingOut.vst3 dist/
          if [ -d build/RingOut_artefacts/Release/AU ]; then cp -R build/RingOut_artefacts/Release/AU/RingOut.component dist/; fi
          cp -R build/RingOut_artefacts/Release/Standalone/* dist/

      - uses: actions/upload-artifact@v4
        with:
          name: RingOut-${{ matrix.name }}
          path: ringout-vst/dist
